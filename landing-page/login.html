<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }

        /* Header */
        .header {
            margin-bottom: 3rem;
        }

        .logo {
            max-width: 200px;
            height: auto;
            margin-bottom: 2rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .fvp-logo {
            max-width: 300px;
            height: auto;
            margin-top: 2rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        /* Login Section */
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .login-title {
            font-size: 2rem;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-subtitle {
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(79, 172, 254, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(79, 172, 254, 0.4);
            background: linear-gradient(135deg, #5bb5ff 0%, #11f3fe 100%);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff6b6b;
            text-align: center;
            margin-top: 16px;
            display: none;
        }



        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                padding: 32px 24px;
            }
            
            .container {
                padding: 0 15px;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header, .login-container {
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <img src="noah-logo.png" alt="Noah Logo" class="logo">
        </header>

        <!-- Login Section -->
        <div class="login-container">
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-subtitle">Sign in to your Noah account</p>

            <form id="loginForm">
                <div class="form-group">
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="Email address" 
                        required
                    >
                </div>
                
                <div class="form-group">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Password" 
                        required
                    >
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Sign In
                </button>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Signing in...</p>
            </div>

            <div class="error-message" id="errorMessage">
                Please enter both email and password
            </div>


        </div>

        <!-- FVP Logo -->
        <div class="fvp-logo-container">
            <img src="fvp-logo.png" alt="FVP Logo" class="fvp-logo">
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');

        // Preset credentials for authentication - Multiple users
        const USERS = [
            { email: 'demo@noah.com', password: 'demo123' },
            { email: 'AAA@noahcloud.ai', password: '@FullView355' }
        ];
        
        // Iconik redirect URL
        const ICONIK_URL = 'https://app.iconik.io/share/collections/4f4b20a4-2bb7-11ee-9be4-da3d73d20660/?object_type=collections&object_id=4f4b20a4-2bb7-11ee-9be4-da3d73d20660&hash=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzaGFyZV9pZCI6ImQ2ZThjMDMwLTcxYTAtMTFmMC04Mjk0LWM2OTUyNGM5NjhiYiIsInNoYXJlX3VzZXJfaWQiOiJkNmVjOGFkYS03MWEwLTExZjAtODI5NC1jNjk1MjRjOTY4YmIiLCJleHAiOjE5MTIwMzk2MDYsInN5cyI6Imljb25pay11cyJ9.DBhS7gXC3L0NEH7EzdtUW-TJg2-9bSgJQUnCJUlXfdI';

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // Hide any previous error
            errorMessage.style.display = 'none';

            // Validate inputs
            if (!email || !password) {
                errorMessage.textContent = 'Please enter both email and password';
                errorMessage.style.display = 'block';
                return;
            }

            // Check credentials against user list
            const user = USERS.find(u => u.email === email && u.password === password);
            if (!user) {
                errorMessage.textContent = 'Invalid email or password. Please try again.';
                errorMessage.style.display = 'block';
                
                // Reset form state
                loginBtn.disabled = false;
                loading.style.display = 'none';
                loginBtn.style.display = 'block';
                return;
            }

            // Show loading state
            loginBtn.disabled = true;
            loading.style.display = 'block';
            loginBtn.style.display = 'none';

            try {
                // Simulate API call delay
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Simulate successful login
                console.log('Login successful:', { email, password });
                
                // Redirect to Iconik
                window.location.href = ICONIK_URL;
                
            } catch (error) {
                console.error('Login error:', error);
                errorMessage.textContent = 'Login failed. Please try again.';
                errorMessage.style.display = 'block';
                
                // Reset form state
                loginBtn.disabled = false;
                loading.style.display = 'none';
                loginBtn.style.display = 'block';
            }
        });

        // Clear error when user starts typing
        emailInput.addEventListener('input', function() {
            if (errorMessage.style.display === 'block') {
                errorMessage.style.display = 'none';
            }
        });

        passwordInput.addEventListener('input', function() {
            if (errorMessage.style.display === 'block') {
                errorMessage.style.display = 'none';
            }
        });
    </script>
</body>
</html>
