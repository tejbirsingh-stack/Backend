<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Auth Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #4facfe; }
        .btn {
            background: #4facfe;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .btn:hover { background: #3d8bfd; }
        .result {
            background: #16213e;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #0f3460;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .success { border-color: #4caf50; }
        .error { border-color: #f44336; }
        input {
            padding: 8px;
            margin: 5px;
            border-radius: 3px;
            border: 1px solid #333;
            background: #0f3460;
            color: white;
        }
        .section {
            background: #0f3460;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>🚀 Noah Authentication Tester</h1>

    <div class="section">
        <h2>Backend URL Configuration</h2>
        <input type="text" id="apiUrl" value="https://noah-production-e15c.up.railway.app" style="width: 400px;">
        <button class="btn" onclick="updateApiUrl()">Update URL</button>
    </div>

    <div class="section">
        <h2>1. Check Auth Status</h2>
        <button class="btn" onclick="checkAuthStatus()">Check Auth Status</button>
        <div id="authStatus" class="result"></div>
    </div>

    <div class="section">
        <h2>2. Create Test User</h2>
        <div>
            <input type="email" id="testEmail" placeholder="Email" value="test@visitdetroit.com">
            <input type="password" id="testPassword" placeholder="Password" value="TestUser123!">
            <input type="text" id="testName" placeholder="Name" value="Test User">
        </div>
        <button class="btn" onclick="createTestUser()">Create Test User</button>
        <div id="createUserResult" class="result"></div>
    </div>

    <div class="section">
        <h2>3. Reset Admin Password</h2>
        <p style="color: #f44336; margin: 10px 0;">⚠️ Use this if login is failing with 401 error</p>
        <button class="btn" onclick="emergencyReset()" style="background: #f44336;">🚨 EMERGENCY Reset (No Auth)</button>
        <button class="btn" onclick="resetAdminPassword()" style="background: #ff9800;">Debug Reset (Needs ALLOW_PASSWORD_RESET)</button>
        <div id="resetPasswordResult" class="result"></div>
    </div>

    <div class="section">
        <h2>4. Test Login</h2>
        <div>
            <input type="email" id="loginEmail" placeholder="Email" value="admin@visitdetroit.com">
            <input type="password" id="loginPassword" placeholder="Password" value="VisitDetroit2024!">
        </div>
        <button class="btn" onclick="testLogin()">Test Login</button>
        <div id="loginResult" class="result"></div>
    </div>

    <div class="section">
        <h2>5. Check Health</h2>
        <button class="btn" onclick="checkHealth()">Check Health</button>
        <div id="healthResult" class="result"></div>
    </div>

    <script>
        let API_URL = 'https://noah-production-e15c.up.railway.app';

        function updateApiUrl() {
            API_URL = document.getElementById('apiUrl').value;
            alert('API URL updated to: ' + API_URL);
        }

        async function makeRequest(method, endpoint, data = null) {
            const url = `${API_URL}${endpoint}`;
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                mode: 'cors',
                credentials: 'include'
            };

            if (data) {
                options.body = JSON.stringify(data);
            }

            try {
                console.log(`${method} ${url}`, data);
                const response = await fetch(url, options);
                const responseData = await response.json();

                return {
                    success: response.ok,
                    status: response.status,
                    data: responseData
                };
            } catch (error) {
                return {
                    success: false,
                    error: error.message,
                    details: error
                };
            }
        }

        async function checkAuthStatus() {
            const result = await makeRequest('GET', '/api/debug/auth-status');
            document.getElementById('authStatus').textContent = JSON.stringify(result, null, 2);
            document.getElementById('authStatus').className = result.success ? 'result success' : 'result error';
        }

        async function createTestUser() {
            const email = document.getElementById('testEmail').value;
            const password = document.getElementById('testPassword').value;
            const name = document.getElementById('testName').value;

            const result = await makeRequest('POST', '/api/debug/create-test-user', {
                email, password, name
            });

            document.getElementById('createUserResult').textContent = JSON.stringify(result, null, 2);
            document.getElementById('createUserResult').className = result.success ? 'result success' : 'result error';
        }

        async function testLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const result = await makeRequest('POST', '/api/auth/login', {
                email, password
            });

            document.getElementById('loginResult').textContent = JSON.stringify(result, null, 2);
            document.getElementById('loginResult').className = result.success ? 'result success' : 'result error';
        }

        async function emergencyReset() {
            const result = await makeRequest('POST', '/api/emergency/fix-admin-password');
            document.getElementById('resetPasswordResult').textContent = JSON.stringify(result, null, 2);
            document.getElementById('resetPasswordResult').className = result.success ? 'result success' : 'result error';
        }

        async function resetAdminPassword() {
            const result = await makeRequest('POST', '/api/debug/reset-admin-password');
            document.getElementById('resetPasswordResult').textContent = JSON.stringify(result, null, 2);
            document.getElementById('resetPasswordResult').className = result.success ? 'result success' : 'result error';
        }

        async function checkHealth() {
            const result = await makeRequest('GET', '/api/health');
            document.getElementById('healthResult').textContent = JSON.stringify(result, null, 2);
            document.getElementById('healthResult').className = result.success ? 'result success' : 'result error';
        }

        // Auto-check status on load
        window.onload = () => {
            checkHealth();
            checkAuthStatus();
        };
    </script>
</body>
</html>
