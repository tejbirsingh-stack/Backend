# Redis Sentinel Configuration for Noah Platform
# Monitors Redis master for high availability

port 26379
daemonize no
protected-mode no
dir /tmp

# Monitor the master named "noah-master"
sentinel monitor noah-master redis-master 6379 1

# Authentication for Redis instances
sentinel auth-pass noah-master noah_redis_password

# Master is down after 5 seconds of no replies
sentinel down-after-milliseconds noah-master 5000

# Failover timeout
sentinel failover-timeout noah-master 10000

# Parallel sync replicas (not needed in dev but good practice)
sentinel parallel-syncs noah-master 1

# Logging
logfile "/var/log/redis-sentinel.log"

# Bind to all interfaces in container
bind 0.0.0.0

# Client reconfiguration script (optional)
# sentinel client-reconfig-script noah-master /etc/redis/reconfigure.sh