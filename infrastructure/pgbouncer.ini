# infrastructure/pgbouncer.ini
[databases]
noah_primary = host=postgres-primary port=5432 dbname=noah
# noah_replica = host=postgres-replica port=5432 dbname=noah # Uncomment if you want to use replica via pgbouncer for reads

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
auth_type = md5 # For simplicity, use md5 or trust for local. scram-sha-256 requires userlist.txt setup.
auth_file = /etc/pgbouncer/userlist.txt # Create this if using md5/scram-sha-256
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100
max_user_connections = 100
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
client_login_timeout = 60
stats_period = 60