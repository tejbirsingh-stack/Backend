version: '3.8'

services:
  # PostgreSQL with TimescaleDB extension
  postgres:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: noah-postgres
    environment:
      POSTGRES_DB: noah_dev
      POSTGRES_USER: noah_user
      POSTGRES_PASSWORD: noah_dev_password
      TIMESCALEDB_TELEMETRY: off
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - noah-network
    command: >
      postgres
      -c shared_preload_libraries=timescaledb
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB

  # Redis Cluster with Sentinel for high availability
  redis-master:
    image: redis:7.2-alpine
    container_name: noah-redis-master
    ports:
      - "6379:6379"
    command: redis-server --requirepass noah_redis_password --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - noah-network
    volumes:
      - redis_master_data:/data

  redis-sentinel:
    image: redis:7.2-alpine
    container_name: noah-redis-sentinel
    ports:
      - "26379:26379"
    volumes:
      - ./infrastructure/redis-sentinel.conf:/etc/redis/sentinel.conf
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis-master
    networks:
      - noah-network

  # PgBouncer for connection pooling
  pgbouncer:
    image: edoburu/pgbouncer:1.18.0
    container_name: noah-pgbouncer
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_USER: noah_user
      DATABASES_PASSWORD: noah_dev_password
      DATABASES_DBNAME: noah_dev
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 25
      MAX_CLIENT_CONN: 100
      SERVER_RESET_QUERY: DISCARD ALL
    ports:
      - "6432:5432"
    depends_on:
      - postgres
    volumes:
      - ./infrastructure/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./infrastructure/userlist.txt:/etc/pgbouncer/userlist.txt
    networks:
      - noah-network

  # Kafka for event streaming
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: noah-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - noah-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: noah-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    networks:
      - noah-network
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Minio for local S3-compatible storage (B2 simulation)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: noah-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: noah_minio_user
      MINIO_ROOT_PASSWORD: noah_minio_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - noah-network
      
  # MinIO setup service
  minio-setup:
    image: minio/mc:latest
    container_name: noah-minio-setup
    depends_on:
      - minio
    volumes:
      - ./infrastructure/scripts/init-minio.sh:/init-minio.sh
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    networks:
      - noah-network

  # Monitoring stack
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: noah-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - noah-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: noah-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: noah_grafana_password
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - noah-network

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: noah-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - noah-network

  # API Service
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.dev
    container_name: noah-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://noah_user:noah_dev_password@pgbouncer:5432/noah_dev
      REDIS_URL: redis://:noah_redis_password@redis-master:6379
      JWT_SECRET: ${JWT_SECRET:-development_jwt_secret_key_replace_in_production}
      JWT_EXPIRE: ${JWT_EXPIRE:-15m}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-7d}
      COOKIE_SECRET: ${COOKIE_SECRET:-development_cookie_secret_key_replace_in_production}
      MFA_ISSUER: ${MFA_ISSUER:-Noah Media Platform (Dev)}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      KAFKA_BROKERS: kafka:9092
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: noah_minio_user
      S3_SECRET_KEY: noah_minio_password
      S3_BUCKET: noah-assets
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      - pgbouncer
      - redis-master
      - kafka
      - minio
    networks:
      - noah-network

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.dev
    container_name: noah-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      REACT_APP_API_URL: http://localhost:3001
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api
    networks:
      - noah-network

volumes:
  postgres_data:
  redis_master_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  noah-network:
    driver: bridge
