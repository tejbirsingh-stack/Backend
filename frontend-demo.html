<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noah Media Asset Management Platform</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      max-width: 500px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    p {
      color: #94a3b8;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      background-color: #0369a1;
      color: #e0f2fe;
      border-radius: 0.5rem;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Noah Platform</h1>
    <p>Simple Docker environment running PostgreSQL, Redis, MinIO, and Web Frontend.</p>
    <div class="status">✓ Services Active</div>
  </div>
</body>

</html>
