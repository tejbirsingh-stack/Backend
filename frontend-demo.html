<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Media Platform - Frontend Demo</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10/dist/framer-motion.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .gradient-text {
            background: linear-gradient(to right, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }
        
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { motion, AnimatePresence } = Motion;

        // Mock data generation
        const generateMockAssets = (count) => {
            const types = ['image', 'video', 'audio', 'document'];
            const names = ['Project Alpha', 'Brand Campaign', 'Product Demo', 'Conference Talk', 'Tutorial Series'];
            
            return Array.from({ length: count }, (_, i) => ({
                id: `asset-${i}`,
                name: `${names[i % names.length]} ${i + 1}`,
                type: types[i % types.length],
                size: Math.floor(Math.random() * 100000000) + 1000000,
                duration: types[i % types.length] === 'video' ? Math.floor(Math.random() * 3600) : null,
                thumbnail: `https://picsum.photos/400/300?random=${i}`,
                url: `https://example.com/assets/${i}`,
                uploadedAt: new Date(Date.now() - Math.random() * 30 * 24 * 60 * 60 * 1000),
                tags: ['important', 'project', 'brand'].slice(0, Math.floor(Math.random() * 3) + 1),
                likes: Math.floor(Math.random() * 100),
                comments: Math.floor(Math.random() * 20),
                views: Math.floor(Math.random() * 1000),
                collections: ['Main Project', 'Archive'].slice(0, Math.floor(Math.random() * 2) + 1),
                aiTags: ['person', 'outdoor', 'technology'].slice(0, Math.floor(Math.random() * 3) + 1),
                metadata: {
                    width: 1920,
                    height: 1080,
                    fps: 30,
                    codec: 'H.264',
                    bitrate: '5 Mbps'
                }
            }));
        };

        // Simple Icons as SVG components
        const SearchIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const GridIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
        );

        const ListIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 10h16M4 14h16M4 18h16" />
            </svg>
        );

        const HeartIcon = () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
        );

        const EyeIcon = () => (
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
        );

        // Main MediaBrowser Component
        function MediaBrowser() {
            const [searchQuery, setSearchQuery] = useState('');
            const [viewMode, setViewMode] = useState('grid');
            const [selectedAssets, setSelectedAssets] = useState(new Set());
            const [isLoading, setIsLoading] = useState(true);

            const mockAssets = useMemo(() => generateMockAssets(50), []);

            useEffect(() => {
                // Simulate loading
                setTimeout(() => setIsLoading(false), 1000);
            }, []);

            const filteredAssets = useMemo(() => {
                return mockAssets.filter(asset => 
                    asset.name.toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [mockAssets, searchQuery]);

            const formatFileSize = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            const formatDuration = (seconds) => {
                if (!seconds) return '';
                const minutes = Math.floor(seconds / 60);
                const remainingSeconds = seconds % 60;
                return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
            };

            const getTypeColor = (type) => {
                switch (type) {
                    case 'video': return 'bg-purple-100 text-purple-700';
                    case 'image': return 'bg-blue-100 text-blue-700';
                    case 'audio': return 'bg-green-100 text-green-700';
                    default: return 'bg-gray-100 text-gray-700';
                }
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-16 h-16 border-4 border-purple-200 border-t-purple-600 rounded-full loading-spinner mx-auto mb-4"></div>
                            <h2 className="text-xl font-semibold text-gray-700">Loading Noah Media Platform...</h2>
                            <p className="text-gray-500 mt-2">Preparing your media library</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
                    {/* Header */}
                    <header className="glass-effect border-b border-white/20 px-6 py-4">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-bold gradient-text">
                                    Noah Media Platform
                                </h1>
                                <p className="text-slate-600 mt-1">
                                    {filteredAssets.length} assets • Production Demo
                                </p>
                            </div>
                            
                            {/* Real-time collaboration avatars */}
                            <div className="flex items-center gap-4">
                                <div className="flex -space-x-2">
                                    {[1, 2, 3].map((id) => (
                                        <motion.div
                                            key={id}
                                            initial={{ scale: 0 }}
                                            animate={{ scale: 1 }}
                                            transition={{ delay: id * 0.1 }}
                                            className="w-8 h-8 rounded-full bg-gradient-to-r from-purple-400 to-pink-400 border-2 border-white flex items-center justify-center text-xs font-semibold text-white"
                                        >
                                            {id}
                                        </motion.div>
                                    ))}
                                    <div className="w-8 h-8 rounded-full bg-slate-200 border-2 border-white flex items-center justify-center text-xs font-semibold text-slate-600">
                                        +5
                                    </div>
                                </div>
                                <span className="text-sm text-slate-600">8 online</span>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="p-6">
                        {/* Controls */}
                        <div className="glass-effect rounded-2xl p-6 mb-6">
                            <div className="flex flex-col md:flex-row gap-4 items-center justify-between">
                                {/* Search */}
                                <div className="relative flex-1 max-w-md">
                                    <SearchIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" />
                                    <input
                                        type="text"
                                        placeholder="Search assets..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    />
                                </div>

                                {/* View Toggle */}
                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => setViewMode('grid')}
                                        className={`p-2 rounded-lg transition-colors ${
                                            viewMode === 'grid' 
                                                ? 'bg-purple-100 text-purple-600' 
                                                : 'text-gray-500 hover:bg-gray-100'
                                        }`}
                                    >
                                        <GridIcon />
                                    </button>
                                    <button
                                        onClick={() => setViewMode('list')}
                                        className={`p-2 rounded-lg transition-colors ${
                                            viewMode === 'list' 
                                                ? 'bg-purple-100 text-purple-600' 
                                                : 'text-gray-500 hover:bg-gray-100'
                                        }`}
                                    >
                                        <ListIcon />
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Assets Grid/List */}
                        <motion.div 
                            layout
                            className={
                                viewMode === 'grid' 
                                    ? 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6'
                                    : 'space-y-4'
                            }
                        >
                            <AnimatePresence>
                                {filteredAssets.map((asset, index) => (
                                    <motion.div
                                        key={asset.id}
                                        layout
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        transition={{ delay: index * 0.05 }}
                                        className={
                                            viewMode === 'grid'
                                                ? 'glass-effect rounded-xl overflow-hidden card-hover'
                                                : 'glass-effect rounded-xl p-4 flex items-center gap-4 card-hover'
                                        }
                                    >
                                        {viewMode === 'grid' ? (
                                            <>
                                                {/* Thumbnail */}
                                                <div className="relative">
                                                    <img
                                                        src={asset.thumbnail}
                                                        alt={asset.name}
                                                        className="w-full h-48 object-cover"
                                                    />
                                                    <div className="absolute top-2 right-2">
                                                        <span className={`px-2 py-1 rounded-full text-xs font-medium ${getTypeColor(asset.type)}`}>
                                                            {asset.type}
                                                        </span>
                                                    </div>
                                                    {asset.duration && (
                                                        <div className="absolute bottom-2 right-2 bg-black/70 text-white px-2 py-1 rounded text-xs">
                                                            {formatDuration(asset.duration)}
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Content */}
                                                <div className="p-4">
                                                    <h3 className="font-semibold text-gray-800 mb-2 truncate">
                                                        {asset.name}
                                                    </h3>
                                                    <p className="text-sm text-gray-500 mb-3">
                                                        {formatFileSize(asset.size)}
                                                    </p>

                                                    {/* Stats */}
                                                    <div className="flex items-center justify-between text-xs text-gray-500">
                                                        <div className="flex items-center gap-3">
                                                            <span className="flex items-center gap-1">
                                                                <HeartIcon />
                                                                {asset.likes}
                                                            </span>
                                                            <span className="flex items-center gap-1">
                                                                <EyeIcon />
                                                                {asset.views}
                                                            </span>
                                                        </div>
                                                        <span>
                                                            {new Date(asset.uploadedAt).toLocaleDateString()}
                                                        </span>
                                                    </div>

                                                    {/* Tags */}
                                                    <div className="flex flex-wrap gap-1 mt-2">
                                                        {asset.tags.slice(0, 2).map(tag => (
                                                            <span key={tag} className="px-2 py-1 bg-purple-50 text-purple-600 rounded text-xs">
                                                                {tag}
                                                            </span>
                                                        ))}
                                                    </div>
                                                </div>
                                            </>
                                        ) : (
                                            <>
                                                {/* List view */}
                                                <img
                                                    src={asset.thumbnail}
                                                    alt={asset.name}
                                                    className="w-16 h-16 object-cover rounded-lg"
                                                />
                                                <div className="flex-1">
                                                    <h3 className="font-semibold text-gray-800">{asset.name}</h3>
                                                    <p className="text-sm text-gray-500">
                                                        {asset.type} • {formatFileSize(asset.size)}
                                                        {asset.duration && ` • ${formatDuration(asset.duration)}`}
                                                    </p>
                                                    <div className="flex items-center gap-4 mt-1 text-xs text-gray-500">
                                                        <span className="flex items-center gap-1">
                                                            <HeartIcon />
                                                            {asset.likes}
                                                        </span>
                                                        <span className="flex items-center gap-1">
                                                            <EyeIcon />
                                                            {asset.views}
                                                        </span>
                                                        <span>{new Date(asset.uploadedAt).toLocaleDateString()}</span>
                                                    </div>
                                                </div>
                                                <div className="flex flex-wrap gap-1">
                                                    {asset.tags.slice(0, 3).map(tag => (
                                                        <span key={tag} className="px-2 py-1 bg-purple-50 text-purple-600 rounded text-xs">
                                                            {tag}
                                                        </span>
                                                    ))}
                                                </div>
                                            </>
                                        )}
                                    </motion.div>
                                ))}
                            </AnimatePresence>
                        </motion.div>

                        {/* Empty State */}
                        {filteredAssets.length === 0 && (
                            <motion.div
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                className="text-center py-12"
                            >
                                <h3 className="text-lg font-semibold text-gray-600 mb-2">No assets found</h3>
                                <p className="text-gray-500">Try adjusting your search criteria</p>
                            </motion.div>
                        )}
                    </main>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MediaBrowser />);
    </script>
</body>
</html>
