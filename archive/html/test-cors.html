<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test for Enhanced Media Server</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .port-test {
            display: inline-block;
            margin: 5px;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .pending {
            background: #fff3cd;
            color: #856404;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #5a67d8;
        }
        #results {
            margin-top: 20px;
            padding: 15px;
            background: #f1f3f4;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Enhanced Media Server CORS Test</h1>
        
        <div class="test-section">
            <h2>Server Configuration</h2>
            <p><strong>API Server:</strong> http://localhost:4000</p>
            <p><strong>CORS Enabled Ports:</strong> 3000-3010, 5173</p>
        </div>

        <div class="test-section">
            <h2>Test Controls</h2>
            <button onclick="testHealth()">Test Health Endpoint</button>
            <button onclick="testMedia()">Test Media Endpoint</button>
            <button onclick="testAllPorts()">Test All CORS Ports</button>
            <button onclick="uploadTestFile()">Test File Upload</button>
        </div>

        <div class="test-section">
            <h2>CORS Port Test Results</h2>
            <div id="portTests"></div>
        </div>

        <div class="test-section">
            <h2>API Response</h2>
            <div id="results">Ready to test...</div>
        </div>

        <div class="test-section">
            <h2>File Upload Test</h2>
            <input type="file" id="fileInput" accept="image/*,video/*,audio/*">
            <button onclick="uploadSelectedFile()">Upload Selected File</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:4000';

        async function testHealth() {
            document.getElementById('results').textContent = 'Testing health endpoint...';
            try {
                const response = await fetch(`${API_URL}/api/health`);
                const data = await response.json();
                document.getElementById('results').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').textContent = `Error: ${error.message}`;
            }
        }

        async function testMedia() {
            document.getElementById('results').textContent = 'Fetching media assets...';
            try {
                const response = await fetch(`${API_URL}/api/media`);
                const data = await response.json();
                document.getElementById('results').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').textContent = `Error: ${error.message}`;
            }
        }

        async function testAllPorts() {
            const portTests = document.getElementById('portTests');
            portTests.innerHTML = '';
            
            // Test ports 3001-3010
            for (let port = 3001; port <= 3010; port++) {
                const testDiv = document.createElement('span');
                testDiv.className = 'port-test pending';
                testDiv.textContent = `Port ${port}: Testing...`;
                portTests.appendChild(testDiv);
                
                // Simulate CORS test from different origin
                fetch(`${API_URL}/api/health`, {
                    headers: {
                        'Origin': `http://localhost:${port}`
                    }
                })
                .then(() => {
                    testDiv.className = 'port-test success';
                    testDiv.textContent = `Port ${port}: ✓`;
                })
                .catch(() => {
                    testDiv.className = 'port-test error';
                    testDiv.textContent = `Port ${port}: ✗`;
                });
            }
        }

        async function uploadTestFile() {
            document.getElementById('results').textContent = 'Creating test file...';
            
            // Create a test text file
            const blob = new Blob(['Test file content from CORS test'], { type: 'text/plain' });
            const file = new File([blob], 'test-cors.txt', { type: 'text/plain' });
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch(`${API_URL}/api/media/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                document.getElementById('results').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').textContent = `Upload Error: ${error.message}`;
            }
        }

        async function uploadSelectedFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file first');
                return;
            }
            
            document.getElementById('results').textContent = `Uploading ${file.name}...`;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch(`${API_URL}/api/media/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                document.getElementById('results').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').textContent = `Upload Error: ${error.message}`;
            }
        }

        // Auto-test health on load
        window.onload = () => {
            testHealth();
        };
    </script>
</body>
</html>
