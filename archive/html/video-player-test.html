<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Video Player Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a202c;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }
        .test-section {
            margin: 30px 0;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .video-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        }
        .video-info {
            padding: 15px;
        }
        .video-title {
            font-weight: bold;
            margin-bottom: 5px;
            color: #2d3748;
        }
        .video-meta {
            font-size: 12px;
            color: #718096;
        }
        video {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #000;
        }
        .player-section {
            margin: 30px 0;
        }
        .enhanced-player {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .enhanced-player video {
            width: 100%;
            height: auto;
            min-height: 400px;
            max-height: 600px;
        }
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 20px;
            color: white;
        }
        .control-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a67d8;
        }
        .timeline {
            flex: 1;
            height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .timeline-progress {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }
        .annotation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .annotation-tools {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }
        .tool-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .tool-btn:hover, .tool-btn.active {
            background: #667eea;
            border-color: #667eea;
        }
        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin: 10px 0;
        }
        .status.success {
            background: #48bb78;
            color: white;
        }
        .status.error {
            background: #f56565;
            color: white;
        }
        .test-results {
            margin-top: 20px;
            padding: 15px;
            background: #edf2f7;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Noah Video Player Test Suite</h1>
        <p>Direct test of video player with local files and annotation features</p>

        <div class="test-section">
            <h2>1. Local Video Files</h2>
            <div id="video-grid" class="video-grid"></div>
            <div id="load-status" class="status">Loading videos...</div>
        </div>

        <div class="test-section">
            <h2>2. Enhanced Video Player with Annotations</h2>
            <div class="player-section">
                <div class="enhanced-player">
                    <video id="main-player" controls></video>
                    <canvas id="annotation-canvas" class="annotation-canvas"></canvas>
                    
                    <div class="annotation-tools">
                        <div class="tool-btn" data-tool="pen" title="Pen">✏️</div>
                        <div class="tool-btn" data-tool="rect" title="Rectangle">▢</div>
                        <div class="tool-btn" data-tool="circle" title="Circle">○</div>
                        <div class="tool-btn" data-tool="arrow" title="Arrow">→</div>
                        <div class="tool-btn" data-tool="text" title="Text">T</div>
                        <div class="tool-btn" data-tool="clear" title="Clear">🗑️</div>
                    </div>
                </div>
            </div>
            <div id="player-status" class="test-results"></div>
        </div>

        <div class="test-section">
            <h2>3. Test Results</h2>
            <button onclick="testLocalPlayback()">Test Local Video Playback</button>
            <button onclick="testAnnotations()">Test Annotation Tools</button>
            <button onclick="testWithReactApp()">Open React App</button>
            <div id="test-results" class="test-results"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let videos = [];
        let currentVideo = null;
        let isDrawing = false;
        let drawingTool = 'pen';
        let annotations = [];
        
        // Canvas setup
        const canvas = document.getElementById('annotation-canvas');
        const ctx = canvas.getContext('2d');
        const player = document.getElementById('main-player');
        
        // Load videos from API
        async function loadVideos() {
            const statusEl = document.getElementById('load-status');
            const gridEl = document.getElementById('video-grid');
            
            try {
                const response = await fetch(`${API_URL}/api/media`);
                const data = await response.json();
                
                if (data.success) {
                    videos = data.assets.filter(a => a.type === 'video');
                    statusEl.className = 'status success';
                    statusEl.textContent = `Loaded ${videos.length} videos`;
                    
                    // Display videos
                    gridEl.innerHTML = videos.map(video => `
                        <div class="video-card">
                            <video 
                                src="${video.url}" 
                                onclick="playVideo('${video.url}', '${video.name}')"
                                onmouseover="this.play()" 
                                onmouseout="this.pause()"
                                muted
                            ></video>
                            <div class="video-info">
                                <div class="video-title">${video.name}</div>
                                <div class="video-meta">
                                    ${video.tags.join(', ')} • ${formatSize(video.size)}
                                </div>
                            </div>
                        </div>
                    `).join('');
                    
                    // Load first video in main player
                    if (videos.length > 0) {
                        playVideo(videos[0].url, videos[0].name);
                    }
                } else {
                    throw new Error(data.error || 'Failed to load videos');
                }
            } catch (error) {
                statusEl.className = 'status error';
                statusEl.textContent = `Error: ${error.message}`;
                console.error('Failed to load videos:', error);
            }
        }
        
        // Play video in main player
        function playVideo(url, name) {
            player.src = url;
            currentVideo = { url, name };
            updatePlayerStatus(`Playing: ${name}`);
            
            // Setup canvas size when video loads
            player.onloadedmetadata = () => {
                canvas.width = player.videoWidth;
                canvas.height = player.videoHeight;
            };
        }
        
        // Annotation tools
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tool = e.currentTarget.dataset.tool;
                
                if (tool === 'clear') {
                    clearAnnotations();
                } else {
                    drawingTool = tool;
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    canvas.style.pointerEvents = 'auto';
                }
            });
        });
        
        // Drawing on canvas
        let startX, startY;
        
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = (e.clientX - rect.left) * (canvas.width / rect.width);
            startY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawAnnotations();
            
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            switch(drawingTool) {
                case 'rect':
                    ctx.rect(startX, startY, x - startX, y - startY);
                    break;
                case 'circle':
                    const radius = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
                    ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
                    break;
                case 'arrow':
                    drawArrow(startX, startY, x, y);
                    break;
                case 'pen':
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(x, y);
                    startX = x;
                    startY = y;
                    break;
            }
            
            ctx.stroke();
        });
        
        canvas.addEventListener('mouseup', (e) => {
            if (isDrawing) {
                isDrawing = false;
                saveAnnotation();
            }
        });
        
        function drawArrow(fromX, fromY, toX, toY) {
            const headlen = 15;
            const angle = Math.atan2(toY - fromY, toX - fromX);
            
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI/6), toY - headlen * Math.sin(angle - Math.PI/6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI/6), toY - headlen * Math.sin(angle + Math.PI/6));
        }
        
        function saveAnnotation() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            annotations.push({
                timestamp: player.currentTime,
                data: imageData,
                tool: drawingTool
            });
            updatePlayerStatus(`Annotation saved at ${formatTime(player.currentTime)}`);
        }
        
        function drawAnnotations() {
            annotations.forEach(ann => {
                if (Math.abs(ann.timestamp - player.currentTime) < 0.5) {
                    ctx.putImageData(ann.data, 0, 0);
                }
            });
        }
        
        function clearAnnotations() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            annotations = [];
            updatePlayerStatus('Annotations cleared');
        }
        
        // Test functions
        async function testLocalPlayback() {
            const resultsEl = document.getElementById('test-results');
            let results = [];
            
            for (const video of videos) {
                try {
                    const testVideo = document.createElement('video');
                    testVideo.src = video.url;
                    
                    await new Promise((resolve, reject) => {
                        testVideo.oncanplay = () => {
                            results.push(`✅ ${video.name} - Playable`);
                            resolve();
                        };
                        testVideo.onerror = () => {
                            results.push(`❌ ${video.name} - Failed to load`);
                            reject();
                        };
                        
                        setTimeout(() => {
                            results.push(`⚠️ ${video.name} - Timeout`);
                            resolve();
                        }, 5000);
                    });
                } catch (error) {
                    console.error(`Error testing ${video.name}:`, error);
                }
            }
            
            resultsEl.innerHTML = '<h4>Playback Test Results:</h4>' + results.join('<br>');
        }
        
        function testAnnotations() {
            const resultsEl = document.getElementById('test-results');
            const tests = [];
            
            // Test canvas
            tests.push(canvas ? '✅ Canvas initialized' : '❌ Canvas not found');
            tests.push(ctx ? '✅ Drawing context ready' : '❌ Drawing context failed');
            tests.push(annotations ? '✅ Annotation storage ready' : '❌ Annotation storage failed');
            
            // Test drawing
            ctx.strokeStyle = '#667eea';
            ctx.beginPath();
            ctx.rect(10, 10, 100, 100);
            ctx.stroke();
            tests.push('✅ Test rectangle drawn');
            
            setTimeout(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                tests.push('✅ Canvas cleared');
                resultsEl.innerHTML = '<h4>Annotation Test Results:</h4>' + tests.join('<br>');
            }, 1000);
        }
        
        function testWithReactApp() {
            window.open('http://localhost:3003', '_blank');
        }
        
        function updatePlayerStatus(message) {
            document.getElementById('player-status').textContent = message;
        }
        
        function formatSize(bytes) {
            const sizes = ['B', 'KB', 'MB', 'GB'];
            if (bytes === 0) return '0 B';
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return Math.round(bytes / Math.pow(1024, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Load videos on page load
        window.addEventListener('load', loadVideos);
        
        // Update annotations on video time update
        player.addEventListener('timeupdate', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawAnnotations();
        });
    </script>
</body>
</html>
