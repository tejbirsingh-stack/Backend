<!DOCTYPE html>
<html>
<head>
    <title>Check App Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status { 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        iframe {
            width: 100%;
            height: 400px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }
        pre {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Noah App Error Checker</h1>
    
    <div class="status info">
        <strong>Testing Noah Web App at http://localhost:3002</strong>
        <p>Check the iframe below and browser console for errors.</p>
    </div>
    
    <h2>App Status:</h2>
    <div id="app-status"></div>
    
    <h2>App Preview:</h2>
    <iframe id="app-frame" src="http://localhost:3002"></iframe>
    
    <h2>Error Console:</h2>
    <pre id="error-log">Monitoring for errors...</pre>
    
    <script>
        // Check if app is responding
        fetch('http://localhost:3002')
            .then(response => {
                if (response.ok) {
                    document.getElementById('app-status').innerHTML = 
                        '<div class="status success">✅ App is responding on port 3002</div>';
                } else {
                    document.getElementById('app-status').innerHTML = 
                        '<div class="status error">❌ App returned status: ' + response.status + '</div>';
                }
            })
            .catch(error => {
                document.getElementById('app-status').innerHTML = 
                    '<div class="status error">❌ Cannot connect to app: ' + error.message + '</div>';
            });
        
        // Try to catch iframe errors
        window.addEventListener('message', function(e) {
            if (e.origin === 'http://localhost:3002') {
                console.log('Message from app:', e.data);
            }
        });
        
        // Monitor console errors
        const originalError = console.error;
        console.error = function() {
            const errorLog = document.getElementById('error-log');
            errorLog.textContent += '\n❌ ' + Array.from(arguments).join(' ');
            originalError.apply(console, arguments);
        };
    </script>
</body>
</html>
