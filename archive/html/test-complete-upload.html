<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Complete Upload Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .results {
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #34d399; font-weight: bold; }
        .error { color: #ef4444; font-weight: bold; }
        .info { color: #4facfe; font-weight: bold; }
        img.preview {
            max-width: 400px;
            margin: 10px 0;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Complete Noah Upload Test Suite</h1>
        
        <div class="test-section">
            <h2>Step 1: Create & Upload Test Image</h2>
            <button class="btn" onclick="runTest1()">Create & Upload Image</button>
            <div id="test1-results" class="results">Ready to test...</div>
        </div>

        <div class="test-section">
            <h2>Step 2: Verify Media List</h2>
            <button class="btn" onclick="runTest2()">Check Media List</button>
            <div id="test2-results" class="results">Ready to test...</div>
        </div>

        <div class="test-section">
            <h2>Step 3: Test Multiple Uploads</h2>
            <button class="btn" onclick="runTest3()">Upload 3 Images</button>
            <div id="test3-results" class="results">Ready to test...</div>
        </div>

        <div class="test-section">
            <h2>Full Test Suite</h2>
            <button class="btn" onclick="runAllTests()">Run All Tests</button>
            <div id="all-results" class="results">Ready to run full test suite...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let lastUploadedFile = null;

        async function createTestImage(name = 'Test Image', color1 = '#667eea', color2 = '#764ba2') {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            
            // Draw gradient background
            const gradient = ctx.createLinearGradient(0, 0, 400, 300);
            gradient.addColorStop(0, color1);
            gradient.addColorStop(1, color2);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 400, 300);
            
            // Add text
            ctx.fillStyle = 'white';
            ctx.font = 'bold 30px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(name, 200, 150);
            ctx.font = '16px Arial';
            ctx.fillText(new Date().toLocaleString(), 200, 180);
            
            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    const file = new File([blob], `test-${Date.now()}.png`, { type: 'image/png' });
                    resolve(file);
                });
            });
        }

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            const response = await fetch(`${API_URL}/media/upload`, {
                method: 'POST',
                body: formData
            });
            
            if (!response.ok) {
                throw new Error(`Upload failed: ${response.status} ${response.statusText}`);
            }
            
            return await response.json();
        }

        async function runTest1() {
            const resultsDiv = document.getElementById('test1-results');
            resultsDiv.innerHTML = '<span class="info">Creating test image...</span>';
            
            try {
                // Create test image
                const file = await createTestImage('Noah Upload Test');
                resultsDiv.innerHTML = `<span class="info">Created image: ${file.name} (${(file.size / 1024).toFixed(2)} KB)</span>\n`;
                
                // Upload it
                resultsDiv.innerHTML += '<span class="info">Uploading to server...</span>\n';
                const result = await uploadFile(file);
                
                if (result.success) {
                    lastUploadedFile = result.asset;
                    resultsDiv.innerHTML += `<span class="success">✅ Upload successful!</span>\n`;
                    resultsDiv.innerHTML += `File: ${result.asset.name}\n`;
                    resultsDiv.innerHTML += `URL: ${result.asset.url}\n`;
                    resultsDiv.innerHTML += `Size: ${(result.asset.size / 1024 / 1024).toFixed(2)} MB\n`;
                    
                    // Try to display the image
                    if (result.asset.url) {
                        const img = document.createElement('img');
                        img.src = result.asset.url.startsWith('http') ? result.asset.url : `http://localhost:3000${result.asset.url}`;
                        img.className = 'preview';
                        img.onload = () => {
                            resultsDiv.innerHTML += '\n<span class="success">✅ Image loaded successfully</span>\n';
                            resultsDiv.appendChild(img);
                        };
                        img.onerror = () => {
                            resultsDiv.innerHTML += '\n<span class="error">❌ Failed to load image</span>\n';
                        };
                    }
                } else {
                    resultsDiv.innerHTML += `<span class="error">❌ Upload failed: ${result.error || 'Unknown error'}</span>\n`;
                }
            } catch (error) {
                resultsDiv.innerHTML += `<span class="error">❌ Error: ${error.message}</span>\n`;
                console.error(error);
            }
        }

        async function runTest2() {
            const resultsDiv = document.getElementById('test2-results');
            resultsDiv.innerHTML = '<span class="info">Fetching media list...</span>';
            
            try {
                const response = await fetch(`${API_URL}/media`);
                const data = await response.json();
                
                if (data.success) {
                    resultsDiv.innerHTML = `<span class="success">✅ Media list retrieved</span>\n`;
                    resultsDiv.innerHTML += `Total assets: ${data.count}\n\n`;
                    
                    // Show last 5 files
                    const recentFiles = data.assets.slice(-5);
                    resultsDiv.innerHTML += 'Recent uploads:\n';
                    recentFiles.forEach(asset => {
                        resultsDiv.innerHTML += `- ${asset.name} (${asset.type}) - ${(asset.size / 1024 / 1024).toFixed(2)} MB\n`;
                    });
                    
                    // Check if our test file is there
                    if (lastUploadedFile) {
                        const found = data.assets.find(a => a.name === lastUploadedFile.name);
                        if (found) {
                            resultsDiv.innerHTML += `\n<span class="success">✅ Last uploaded file found in media list!</span>\n`;
                        } else {
                            resultsDiv.innerHTML += `\n<span class="error">❌ Last uploaded file not found in media list</span>\n`;
                        }
                    }
                } else {
                    resultsDiv.innerHTML = `<span class="error">❌ Failed to get media list</span>\n`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>\n`;
            }
        }

        async function runTest3() {
            const resultsDiv = document.getElementById('test3-results');
            resultsDiv.innerHTML = '<span class="info">Creating multiple test images...</span>\n';
            
            const colors = [
                ['#FF6B6B', '#4ECDC4'],
                ['#45B7D1', '#96CEB4'],
                ['#FFEAA7', '#DFE6E9']
            ];
            
            try {
                for (let i = 0; i < 3; i++) {
                    const file = await createTestImage(`Test Image ${i + 1}`, colors[i][0], colors[i][1]);
                    resultsDiv.innerHTML += `\n<span class="info">Uploading image ${i + 1}...</span>`;
                    
                    const result = await uploadFile(file);
                    if (result.success) {
                        resultsDiv.innerHTML += ` <span class="success">✅ Success</span>\n`;
                    } else {
                        resultsDiv.innerHTML += ` <span class="error">❌ Failed</span>\n`;
                    }
                    
                    // Small delay between uploads
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                resultsDiv.innerHTML += '\n<span class="success">✅ All uploads completed!</span>\n';
            } catch (error) {
                resultsDiv.innerHTML += `\n<span class="error">❌ Error: ${error.message}</span>\n`;
            }
        }

        async function runAllTests() {
            const resultsDiv = document.getElementById('all-results');
            resultsDiv.innerHTML = '<span class="info">Starting full test suite...</span>\n\n';
            
            resultsDiv.innerHTML += '<span class="info">Test 1: Single Upload</span>\n';
            await runTest1();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            resultsDiv.innerHTML += '\n<span class="info">Test 2: Verify Media List</span>\n';
            await runTest2();
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            resultsDiv.innerHTML += '\n<span class="info">Test 3: Multiple Uploads</span>\n';
            await runTest3();
            
            resultsDiv.innerHTML += '\n\n<span class="success">🎉 Full test suite completed!</span>\n';
            resultsDiv.innerHTML += 'Check the Noah web app at http://localhost:3002 to see the uploaded files.\n';
        }

        // Check API health on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                console.log('✅ API is healthy:', data);
            } catch (error) {
                console.error('❌ API health check failed:', error);
                alert('API server is not running! Please start the server first.');
            }
        });
    </script>
</body>
</html>
