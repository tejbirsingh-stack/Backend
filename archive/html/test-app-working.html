<!DOCTYPE html>
<html>
<head>
    <title>Test Noah App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .btn {
            background: #4facfe;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #3d9fe8;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 2px solid #ddd;
            border-radius: 5px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Noah App Status Check</h1>
        
        <div id="status-container"></div>
        
        <div style="margin: 20px 0;">
            <a href="http://localhost:3002" target="_blank" class="btn">Open App in New Tab</a>
            <button class="btn" onclick="checkStatus()">Check Status</button>
            <button class="btn" onclick="location.reload()">Refresh</button>
        </div>
        
        <h2>App Preview:</h2>
        <iframe src="http://localhost:3002" id="app-frame"></iframe>
    </div>
    
    <script>
        async function checkStatus() {
            const container = document.getElementById('status-container');
            container.innerHTML = '<div class="status info">Checking services...</div>';
            
            let statusHTML = '';
            
            // Check web app
            try {
                const webResponse = await fetch('http://localhost:3002');
                if (webResponse.ok) {
                    statusHTML += '<div class="status success">✅ Web App: Running on port 3002</div>';
                } else {
                    statusHTML += '<div class="status error">❌ Web App: Returned status ' + webResponse.status + '</div>';
                }
            } catch (error) {
                statusHTML += '<div class="status error">❌ Web App: Not responding</div>';
            }
            
            // Check API
            try {
                const apiResponse = await fetch('http://localhost:3000/api/health');
                const apiData = await apiResponse.json();
                if (apiResponse.ok) {
                    statusHTML += '<div class="status success">✅ API Server: Running (v' + apiData.version + ')</div>';
                } else {
                    statusHTML += '<div class="status error">❌ API Server: Returned status ' + apiResponse.status + '</div>';
                }
            } catch (error) {
                statusHTML += '<div class="status error">❌ API Server: Not responding on port 3000</div>';
            }
            
            // Check media endpoint
            try {
                const mediaResponse = await fetch('http://localhost:3000/api/media');
                const mediaData = await mediaResponse.json();
                if (mediaResponse.ok && mediaData.success) {
                    statusHTML += '<div class="status success">✅ Media API: ' + mediaData.count + ' files available</div>';
                } else {
                    statusHTML += '<div class="status error">❌ Media API: Not working properly</div>';
                }
            } catch (error) {
                statusHTML += '<div class="status error">❌ Media API: Error fetching media</div>';
            }
            
            container.innerHTML = statusHTML;
        }
        
        // Check status on load
        window.addEventListener('load', () => {
            checkStatus();
            
            // Try to detect if the app loads properly in the iframe
            const iframe = document.getElementById('app-frame');
            iframe.addEventListener('load', () => {
                try {
                    // This will fail due to CORS, but it's ok
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    console.log('App loaded in iframe');
                } catch (e) {
                    console.log('App loaded (CORS prevents access, which is normal)');
                }
            });
        });
    </script>
</body>
</html>
