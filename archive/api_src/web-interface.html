<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah Media Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5em;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background: #eef0ff;
            border-color: #764ba2;
        }
        
        .upload-area.dragover {
            background: #e0e5ff;
            border-color: #764ba2;
        }
        
        .file-input {
            display: none;
        }
        
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .media-item {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }
        
        .media-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .media-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 3em;
        }
        
        .media-preview img,
        .media-preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .media-info {
            padding: 15px;
        }
        
        .media-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .media-meta {
            color: #666;
            font-size: 0.9em;
        }
        
        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        
        .delete-btn:hover {
            background: #cc0000;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .upload-progress {
            margin-top: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        
        .progress-bar {
            height: 30px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            margin: 5px;
            min-width: 150px;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }
        
        .stat-label {
            margin-top: 5px;
            opacity: 0.9;
        }
        
        .storage-selector {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 10px;
        }
        
        .storage-option {
            padding: 10px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            background: white;
            color: #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .storage-option:hover {
            background: #f8f9ff;
        }
        
        .storage-option.active {
            background: #667eea;
            color: white;
        }
        
        .upload-destination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .upload-destination label {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .upload-destination label:hover {
            background: rgba(102, 126, 234, 0.1);
        }
        
        .upload-destination input[type="radio"] {
            cursor: pointer;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        
        .modal img,
        .modal video {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Noah Media Server</h1>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalFiles">0</div>
                <div class="stat-label">Total Files</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalSize">0 MB</div>
                <div class="stat-label">Total Size</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="mediaTypes">0</div>
                <div class="stat-label">Media Types</div>
            </div>
        </div>
        
        <div class="upload-area" id="uploadArea">
            <input type="file" id="fileInput" class="file-input" multiple accept="image/*,video/*,audio/*">
            <h2>📁 Drop files here or click to upload</h2>
            <p>Supports images, videos, and audio files</p>
            <div class="upload-destination" id="uploadDestination">
                <label>
                    <input type="radio" name="destination" value="local" checked>
                    💾 Local Only
                </label>
                <label>
                    <input type="radio" name="destination" value="b2">
                    ☁️ B2 Only
                </label>
                <label>
                    <input type="radio" name="destination" value="both">
                    🔄 Both
                </label>
            </div>
        </div>
        
        <div class="storage-selector">
            <button class="storage-option active" data-source="all">All Storage</button>
            <button class="storage-option" data-source="local">💾 Local Files</button>
            <button class="storage-option" data-source="b2">☁️ B2 Cloud</button>
        </div>
        
        <div class="upload-progress" id="uploadProgress">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        
        <div id="mediaGrid" class="media-grid">
            <div class="loading">Loading media assets...</div>
        </div>
    </div>
    
    <div class="modal" id="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content" id="modalContent"></div>
    </div>
    
    <script>
        const API_BASE = window.location.origin;
        let mediaAssets = [];
        let currentSource = 'all';
        let b2Enabled = false;
        
        // Load media on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadMedia();
            setupUpload();
            setupStorageSelector();
            checkB2Status();
        });
        
        async function loadMedia(source = 'all') {
            try {
                const response = await fetch(`${API_BASE}/api/media?source=${source}`);
                const data = await response.json();
                
                if (data.success) {
                    mediaAssets = data.assets || [];
                    displayMedia(mediaAssets);
                    updateStats(mediaAssets);
                }
            } catch (error) {
                console.error('Error loading media:', error);
                document.getElementById('mediaGrid').innerHTML = '<div class="loading">Error loading media</div>';
            }
        }
        
        function displayMedia(assets) {
            const grid = document.getElementById('mediaGrid');
            
            if (assets.length === 0) {
                grid.innerHTML = '<div class="loading">No media files found. Upload some files to get started!</div>';
                return;
            }
            
            grid.innerHTML = assets.map(asset => `
                <div class="media-item" data-id="${asset.id}">
                    <div class="media-preview" onclick="viewMedia('${asset.url}', '${asset.type}')">
                        ${getPreview(asset)}
                    </div>
                    <div class="media-info">
                        <div class="media-name" title="${asset.name}">${asset.name}</div>
                        <div class="media-meta">
                            ${formatFileSize(asset.size)} • ${asset.type}
                        </div>
                        <button class="delete-btn" onclick="deleteMedia('${asset.name}', event)">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        function getPreview(asset) {
            if (asset.type === 'image') {
                return `<img src="${asset.url}" alt="${asset.name}" loading="lazy">`;
            } else if (asset.type === 'video') {
                return `<video src="${asset.url}" muted></video>`;
            } else if (asset.type === 'audio') {
                return '🎵';
            } else {
                return '📄';
            }
        }
        
        function viewMedia(url, type) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modalContent');
            
            if (type === 'image') {
                content.innerHTML = `<img src="${url}" alt="Media">`;
            } else if (type === 'video') {
                content.innerHTML = `<video src="${url}" controls autoplay></video>`;
            } else if (type === 'audio') {
                content.innerHTML = `<audio src="${url}" controls autoplay></audio>`;
            } else {
                window.open(url, '_blank');
                return;
            }
            
            modal.style.display = 'flex';
        }
        
        function closeModal() {
            const modal = document.getElementById('modal');
            modal.style.display = 'none';
            document.getElementById('modalContent').innerHTML = '';
        }
        
        function setupUpload() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            
            uploadArea.addEventListener('click', () => fileInput.click());
            
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });
            
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            
            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
            });
        }
        
        async function handleFiles(files) {
            const progressDiv = document.getElementById('uploadProgress');
            const progressBar = document.getElementById('progressBar');
            const destination = document.querySelector('input[name="destination"]:checked').value;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                progressDiv.style.display = 'block';
                
                const formData = new FormData();
                formData.append('file', file);
                formData.append('destination', destination);
                
                try {
                    const xhr = new XMLHttpRequest();
                    
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percentComplete = (e.loaded / e.total) * 100;
                            progressBar.style.width = percentComplete + '%';
                            progressBar.textContent = Math.round(percentComplete) + '%';
                        }
                    });
                    
                    xhr.addEventListener('load', () => {
                        if (xhr.status === 200) {
                            loadMedia();
                        }
                    });
                    
                    xhr.open('POST', `${API_BASE}/api/media/upload`);
                    xhr.send(formData);
                    
                } catch (error) {
                    console.error('Upload error:', error);
                    alert('Error uploading file: ' + file.name);
                }
            }
            
            setTimeout(() => {
                progressDiv.style.display = 'none';
                progressBar.style.width = '0%';
                progressBar.textContent = '0%';
            }, 1000);
        }
        
        async function deleteMedia(filename, event) {
            event.stopPropagation();
            
            if (!confirm(`Are you sure you want to delete ${filename}?`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/media/${encodeURIComponent(filename)}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    loadMedia();
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('Error deleting file');
            }
        }
        
        function updateStats(assets) {
            const totalSize = assets.reduce((sum, asset) => sum + (asset.size || 0), 0);
            const types = new Set(assets.map(a => a.type));
            
            document.getElementById('totalFiles').textContent = assets.length;
            document.getElementById('totalSize').textContent = formatFileSize(totalSize);
            document.getElementById('mediaTypes').textContent = types.size;
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function setupStorageSelector() {
            const buttons = document.querySelectorAll('.storage-option');
            buttons.forEach(button => {
                button.addEventListener('click', (e) => {
                    buttons.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentSource = e.target.dataset.source;
                    loadMedia(currentSource);
                });
            });
        }
        
        async function checkB2Status() {
            try {
                const response = await fetch(`${API_BASE}/api/storage/status`);
                const data = await response.json();
                
                if (data.success && data.storage.b2.enabled) {
                    b2Enabled = true;
                    console.log('B2 Storage is enabled');
                } else {
                    // Hide B2-related options if not enabled
                    document.querySelectorAll('[data-source="b2"]').forEach(el => el.style.display = 'none');
                    document.querySelectorAll('input[value="b2"], input[value="both"]').forEach(el => {
                        el.parentElement.style.display = 'none';
                    });
                }
            } catch (error) {
                console.error('Error checking B2 status:', error);
            }
        }
        
        // Close modal on click outside
        window.addEventListener('click', (e) => {
            const modal = document.getElementById('modal');
            if (e.target === modal) {
                closeModal();
            }
        });
        
        // Close modal on Escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
