<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Video Player Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 8px;
        }
        .video-container {
            margin: 20px 0;
        }
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 8px;
        }
        .status {
            padding: 10px;
            background: #222;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
        }
        .success {
            color: #4ade80;
        }
        .error {
            color: #f87171;
        }
        .info {
            color: #60a5fa;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Enhanced Video Player Test Suite</h1>
        
        <div class="test-section">
            <h2>1. Direct Static File Test</h2>
            <div class="status" id="static-status">Testing static file serving...</div>
            <div class="video-container">
                <video id="static-video" controls width="800">
                    <source src="http://localhost:3000/uploads/9e43915c-d31f-4238-8847-144bb11cd338.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <button onclick="testStaticVideo()">Test Play</button>
            <button onclick="testSeek()">Test Seek</button>
        </div>

        <div class="test-section">
            <h2>2. Vite Proxy Test (Port 3002)</h2>
            <div class="status" id="proxy-status">Testing Vite proxy...</div>
            <div class="video-container">
                <video id="proxy-video" controls width="800">
                    <source src="http://localhost:3002/uploads/9e43915c-d31f-4238-8847-144bb11cd338.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <button onclick="testProxyVideo()">Test Play</button>
        </div>

        <div class="test-section">
            <h2>3. API Media Fetch Test</h2>
            <div class="status" id="api-status">Fetching media from API...</div>
            <div id="media-list"></div>
        </div>

        <div class="test-section">
            <h2>4. Available Video Files</h2>
            <div id="video-files"></div>
        </div>
    </div>

    <script>
        // Test static video
        const staticVideo = document.getElementById('static-video');
        const staticStatus = document.getElementById('static-status');
        
        staticVideo.addEventListener('loadedmetadata', () => {
            staticStatus.innerHTML = `<span class="success">✅ Static video loaded! Duration: ${staticVideo.duration.toFixed(2)}s</span>`;
        });
        
        staticVideo.addEventListener('error', (e) => {
            staticStatus.innerHTML = `<span class="error">❌ Static video error: ${e.message || 'Failed to load'}</span>`;
        });

        // Test proxy video
        const proxyVideo = document.getElementById('proxy-video');
        const proxyStatus = document.getElementById('proxy-status');
        
        proxyVideo.addEventListener('loadedmetadata', () => {
            proxyStatus.innerHTML = `<span class="success">✅ Proxy video loaded! Duration: ${proxyVideo.duration.toFixed(2)}s</span>`;
        });
        
        proxyVideo.addEventListener('error', (e) => {
            proxyStatus.innerHTML = `<span class="error">❌ Proxy video error: ${e.message || 'Failed to load'}</span>`;
        });

        // Test functions
        function testStaticVideo() {
            staticVideo.play().then(() => {
                staticStatus.innerHTML += '<br><span class="success">✅ Video playing!</span>';
            }).catch(err => {
                staticStatus.innerHTML += `<br><span class="error">❌ Play error: ${err.message}</span>`;
            });
        }

        function testProxyVideo() {
            proxyVideo.play().then(() => {
                proxyStatus.innerHTML += '<br><span class="success">✅ Video playing!</span>';
            }).catch(err => {
                proxyStatus.innerHTML += `<br><span class="error">❌ Play error: ${err.message}</span>`;
            });
        }

        function testSeek() {
            staticVideo.currentTime = staticVideo.duration / 2;
            staticStatus.innerHTML += `<br><span class="info">⏩ Seeked to ${(staticVideo.duration / 2).toFixed(2)}s</span>`;
        }

        // Fetch media from API
        async function fetchMedia() {
            const apiStatus = document.getElementById('api-status');
            const mediaList = document.getElementById('media-list');
            
            try {
                const response = await fetch('http://localhost:3000/api/media');
                const data = await response.json();
                
                if (data.success) {
                    apiStatus.innerHTML = `<span class="success">✅ API fetch successful! Found ${data.count} assets</span>`;
                    
                    const videos = data.assets.filter(a => a.type === 'video');
                    if (videos.length > 0) {
                        mediaList.innerHTML = '<h3>Video Assets:</h3><ul>' + 
                            videos.map(v => `<li>${v.name} - <a href="http://localhost:3000${v.url}" target="_blank">Open</a></li>`).join('') +
                            '</ul>';
                    }
                } else {
                    apiStatus.innerHTML = `<span class="error">❌ API error: ${data.error}</span>`;
                }
            } catch (err) {
                apiStatus.innerHTML = `<span class="error">❌ Fetch error: ${err.message}</span>`;
            }
        }

        // List available video files
        async function listVideoFiles() {
            const videoFiles = document.getElementById('video-files');
            try {
                const response = await fetch('http://localhost:3000/api/media');
                const data = await response.json();
                
                if (data.success) {
                    const videos = data.assets.filter(a => a.type === 'video');
                    videoFiles.innerHTML = '<h3>Available Videos:</h3>';
                    
                    videos.forEach(video => {
                        const videoEl = document.createElement('div');
                        videoEl.innerHTML = `
                            <div style="margin: 10px 0; padding: 10px; background: #222; border-radius: 4px;">
                                <strong>${video.name}</strong><br>
                                <video controls width="400" style="margin-top: 10px;">
                                    <source src="http://localhost:3000${video.url}" type="video/mp4">
                                </video>
                            </div>
                        `;
                        videoFiles.appendChild(videoEl);
                    });
                }
            } catch (err) {
                videoFiles.innerHTML = `<span class="error">❌ Error listing videos: ${err.message}</span>`;
            }
        }

        // Run tests on load
        window.addEventListener('load', () => {
            fetchMedia();
            listVideoFiles();
        });
    </script>
</body>
</html>
