<!DOCTYPE html>
<html>
<head>
    <title>Create Test Image</title>
</head>
<body>
    <h1>Creating Test Image...</h1>
    <canvas id="canvas" width="400" height="300"></canvas>
    <br>
    <a id="download" download="test-image.png">Download Image</a>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Draw gradient
        const gradient = ctx.createLinearGradient(0, 0, 400, 300);
        gradient.addColorStop(0, '#667eea');
        gradient.addColorStop(1, '#764ba2');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 400, 300);
        
        // Add text
        ctx.fillStyle = 'white';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('Test Upload', 200, 150);
        
        // Convert to data URL and set download link
        canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            document.getElementById('download').href = url;
            
            // Also try to auto-download
            const a = document.createElement('a');
            a.href = url;
            a.download = 'test-upload.png';
            a.click();
        });
    </script>
</body>
</html>
