version: 0.2

phases:
  build:
    commands:
      - echo "Deploying Backend..."

      - |
        COMMAND_ID=$(aws ssm send-command \
          --region us-east-2 \
          --instance-ids i-00c9c1576a9b26183 \
          --document-name "AWS-RunShellScript" \
          --parameters '{
            "commands":[
              "git config --global --add safe.directory /opt/noah-backend",
              "cd /opt/noah-backend",
              "git pull origin qa",
              "cd /opt/noah",
              "docker compose up -d --build backend"
            ]
          }' \
          --query "Command.CommandId" \
          --output text)

        echo "Command ID: $COMMAND_ID"

        aws ssm wait command-executed \
          --region us-east-2 \
          --command-id $COMMAND_ID \
          --instance-id i-00c9c1576a9b26183

        aws ssm get-command-invocation \
          --region us-east-2 \
          --command-id $COMMAND_ID \
          --instance-id i-00c9c1576a9b26183
